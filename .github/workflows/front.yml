name: Doctu Frontend CI/CD

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: React Build & QA
    runs-on: ubuntu-latest
    
    # 1. Le decimos a todos los comandos 'run' que se ejecuten dentro de esta carpeta
    defaults:
      run:
        working-directory: ./doctu-front
        
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          # 2. Le indicamos al caché dónde encontrar el lockfile para que no se pierda
          cache-dependency-path: ./doctu-front/package-lock.json
          
      - name: Instalación limpia de dependencias
        run: npm ci 
        
      - name: Ejecutar pruebas unitarias
        run: npm run test -- --passWithNoTests
        env:
          CI: true
          
      - name: Compilación optimizada para producción
        run: npm run build
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
