services:
  backend:
    build: ./Back
    ports:
      - "5000:5000"
    environment:
      # Conecta directamente a la base de datos local que levantó 'supabase start'
      - DB_URL=postgresql://postgres:postgres@host.docker.internal:54322/postgres
      - PORT=5000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./Front
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - backend